<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    

    <section id="container">
        <div id="left">
            <section id="icons">
                <img src="./icons/share.svg" class="icons">
                <img src="./icons/heart.svg" class="icons">
            </section>

            <section id="main-img">
                <img src="./images/apple.png"  id="apple-img">
            </section>

            <section id="apples">
                <img src="./images/full-apple.jpg" alt="" class="small-apples">
                <img src="./images/half-cut-apple.jpg" alt="" class="small-apples">
                <img src="./images/full-apple.jpg" alt="" class="small-apples">
                <img src="./images/top-apple.png" alt="" class="small-apples">
            </section>
        </div>

        <div id="right">
            <section id="sectionOne">
                <h1>Delicious Apples</h1>
                <span>COD: 45999</span>
            </section>

            <section id="sectionTwo">
                <h1> <span>R$ </span>7.93</h1>
                <div id="colors">
                    <p>SELECT A COLOR</p>
                    <div id="cards">
                        <img src="./images/full-apple.jpg" class="color-cards" id="chosen">
                        <img src="./images/yellow-apple.webp" class="color-cards">
                        <img src="./images/reddish apple.webp" class="color-cards">
                        <img src="./images/red apple.webp" class="color-cards">
                    </div>
                </div>
                <div id="benefits">
                    <p>BENEFITS</p> 
                    <ul>
                        <li>Apples are nutricious</li>
                        <li>Apples may be good for weight loss</li>
                        <li>Apples may be good for bone health</li>
                        <li>They're linked to a lowest risk of diabetes</li>
                    </ul>
                </div>
                <button id="addToCart">ADD TO CART</button>
            </section>
        </div>
    </section>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOG IN</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="./icons/profile.svg" type="image/x-icon">
</head>
<body>
    <main>
        <section id="container">
            <div id="left">
                <h1>Sigh in</h1>
                <div id="icons">
                    <img src="./icons/google.svg" class="icons">
                    <img src="./icons/facebook.svg" class="icons">
                    <img src="./icons/Github.svg" class="icons">
                    <img src="./icons/linked-in.svg" class="icons">
                </div>
                <div id="inputs">
                    <span>or use email password</span>
                    <input type="email" required placeholder="Email" class="inputs">
                    <input type="password" required placeholder="Password" class="inputs">
                </div>
                <div id="btn">
                    <span>Forget Your Password?</span>
                    <button id="sign-in">SIGN IN</button>
                </div>
            </div>

            <div id="right">
                <h1>Hello, Friend!</h1>
                <p>Register with your personal details to use all of site features</p>
                <button id="sign-up">SIGN UP</button>
            </div>
        </section>
    </main>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <main>
        <form>
            <h1>Get in Touch</h1>
            <p>Lorem ipsum dolor sit amet.</p>
            <section class="cardOne">
                <div id="left">
                    <label for="name">FIRST NAME</label><br>
                    <input type="text" id="name" placeholder="Please enter first name..." required><br>
    
                    <label for="last-name">LAST NAME</label><br>
                    <input type="text" name="last-name" placeholder="Please enter last name..."><br>
                </div>

                <div id="right">
                    <label for="email">EMAIL</label><br>
                    <input type="email" required  placeholder="Please enter email..."><br>
                    <label for="phone-number">PHONE NUMBER</label><br>
                    <input type="text" required maxlength="9" placeholder="Please enter phone number">
                </div>
            </section>
            <section id="sectionTwo">
                <label for="question">WHAT DO YOU HAVE IN MIND</label>
                <textarea name="question" id="question" placeholder="Please enter query..."></textarea>
                <input type="submit" id="submit">
            </section>
        </form>
    </main>
</body>
</html>

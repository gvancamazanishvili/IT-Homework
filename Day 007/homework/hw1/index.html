<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <div id="left">
            <img src="./heel.png" id="heel">
        </div>

        <div id="right">
            <h1>Womans's Heels</h1>
            <p>Inclusive of all Taxes</p>
            <span id="mainSpan"><strong id="big">$99</strong> <strong>.99</strong></span>
            <h3>Chose your size</h3>
            <div id="btns">
                <button class="sizes">6</button>
                <button class="sizes">7</button>
                <button class="sizes">8</button>
                <button class="sizes">9</button>
                <button class="sizes">10</button>
                <button class="sizes">11</button>
                <button class="sizes">12</button>
            </div>
            <h2 id="color-Section">Colors: 
                <img src="./icons/white.svg">
                <img src="./icons/red.svg">
                <img src="./icons/black.svg">
            </h2>

            <button id="addToCart">ADD TO CART</button>
        </div>
    </div>
</body>
</html>

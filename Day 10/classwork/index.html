<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <section id="container">
        <div id="picture">
            <img src="./strawberry.png" id="img">
        </div>

        <button class="arrow arrow-left">
            <img src="./icons/left.svg" alt="Previous">
        </button>
        <button class="arrow arrow-right">
            <img src="./icons/right.svg" alt="Next">
        </button>


        <section id="sectionTwo">
            <h1>Strawberries</h1>
            <p>the garden strawberry is a widely grown hybrid species of the genus Frangaria. it is cultivated worldwide for its fruit.</p>
        </section>

        <section id="money">
            <div class="blocks">
                <p class="label">Quantity</p>
                <div class="value">
                    <img src="./icons/minus.svg" alt="-"class="add-minus">
                    <span>1</span>
                    <img src="./icons/plus.svg" alt="+" class="add-minus">
                </div>
            </div>

            <div class="blocks">
                <p class="label">Total Price</p>
                <div class="value price">
                    <img src="./icons/yen.svg" alt="₹">
                    <span>7</span>
                </div>
            </div>

            <div class="blocks">
                <p class="label">Delivery</p>
                <div class="value delivery">
                    <img src="./icons/plane.svg" alt="plane">
                    <span>In 60 mins</span>
                </div>
            </div>
        </section>
        <button id="addToCart">ADD TO CART</button>
    </section>
</body>
</html>
